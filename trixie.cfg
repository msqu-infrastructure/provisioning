################################################################################
# disable Predictable Network Interface Names
d-i debian-installer/add-kernel-opts string net.ifnames=0

### Localization

# Locale setup
d-i debian-installer/language string en
d-i	debian-installer/country string	DE
d-i debian-installer/locale string en_US.UTF-8
d-i	localechooser/supported-locales	multiselect	en_US.UTF-8 de_DE.UTF-8

# Keyboard selection.
d-i console-setup/ask_detect boolean false
d-i keymap select de
d-i keyboard-configuration/xkb-keymap select de

################################################################################
### Network configuration
################################################################################

# Any hostname and domain names assigned from dhcp take precedence over
# # values set here. However, setting the values still prevents the questions
# # from being shown, even if values come from dhcp.
d-i netcfg/get_hostname string debian
d-i netcfg/get_domain string localdomain
#
# If you want to force a hostname, regardless of what either the DHCP
# # server returns or what the reverse DNS entry for the IP is, uncomment
# # and adjust the following line.

d-i netcfg/choose_interface select auto
d-i netcfg/link_wait_timeout string 10
d-i netcfg/dhcp_timeout string 30
d-i netcfg/dhcpv6_timeout string 30
d-i netcfg/get_hostname seen true
d-i netcfg/get_domain seen true
d-i netcfg/hostname string debian

################################################################################
### Mirror settings
################################################################################

d-i mirror/country string manual
d-i mirror/http/hostname string deb.debian.org
d-i mirror/http/directory string /debian
d-i mirror/http/proxy string

################################################################################
### Clock and time zone setup
################################################################################

d-i clock-setup/utc boolean true
d-i time/zone string Europe/Berlin
d-i clock-setup/ntp boolean true

################################################################################
### Partitioning
################################################################################

## ignore no swap warning
d-i partman-basicfilesystems/no_swap boolean false

# The presently available methods are:
# - regular: use the usual partition types for your architecture
# - lvm:     use LVM to partition the disk
# - crypto:  use LVM within an encrypted partition
d-i partman-auto/disk string /dev/sda

# If one of the disks that are going to be automatically partitioned
# contains an old LVM configuration, the user will normally receive a
# warning. Preseed this away
d-i     partman-lvm/device_remove_lvm boolean true

# And the same goes for the confirmation to write the lvm partitions.
d-i     partman-lvm/confirm boolean true

# Really, please don't prompt me!
d-i     partman-lvm/confirm_nooverwrite boolean true

d-i partman-auto/expert_recipe string root :: 1000 50 -1 ext4 \
     $primary{ } $bootable{ } method{ format } \
     format{ } use_filesystem{ } filesystem{ ext4 } \
     mountpoint{ / } \
     options/noatime{ noatime } \
     options/discard{ discard } \
    .

d-i partman-auto/choose_recipe select root

# This makes partman automatically partition without confirmation, provided
# that you told it what to do using one of the methods above.
d-i     partman-partitioning/confirm_write_new_label boolean true
d-i     partman/choose_partition select finish
d-i     partman/confirm boolean true
d-i     partman/confirm_nooverwrite boolean true

################################################################################
### Base system installation
################################################################################

#d-i base-installer/kernel/skip-install boolean true
#d-i base-installer/kernel/image string linux-generic

################################################################################
### Account setup
################################################################################

# Root password
d-i passwd/root-password-crypted password $6$1qxnikLAV/9Y3yJi$ZBNNxIoJlU57sUjXLgAtPChJMT18Rtx2kCBP3tjA7mh0skD3K6Bx8aHdVZ1F8/xIpAj5WX0zkUXOYQWhNRdoe0
d-i passwd/user-fullname string user
d-i passwd/username string user
d-i passwd/user-password-crypted password $6$kb8k7nviNVs63X.a$KP.GQpc2UyWozR.5qvaZibiEJ6LQGWmFU5/3WyO2sMpKgK4EE89VrlBExhxAbyzYkg78cKBPHgTnn9IkVbP1M0
d-i passwd/user-default-groups string sudo
d-i user-setup/encrypt-home boolean false

################################################################################
### Apt setup
################################################################################

d-i apt-setup/cdrom/set-first boolean false
d-i apt-setup/cdrom/set-next boolean false
d-i apt-setup/cdrom/set-failed boolean false
d-i apt-setup/non-free boolean true
d-i apt-setup/contrib boolean true
d-i apt-setup/services-select multiselect security, updates, backports
d-i apt-setup/security_host string security.debian.org

################################################################################
### Restart services automatically
################################################################################

d-i libraries/restart-without-asking boolean true

################################################################################
### Package selection
################################################################################

tasksel tasksel/first multiselect minimal
d-i pkgsel/include string \
    acl apparmor bash-completion bridge-utils bc \
    conntrack curl dnsutils file gawk gnupg htop inotify-tools jq kmod \
    libxml2-utils lsof lvm2 moreutils nano ncdu netcat-openbsd \
    psmisc python3-dnspython python3-netaddr rsync rsyslog \
    sudo sysfsutils sysstat tmux wget xauth postfix mailutils libsasl2-2 \
    sasl2-bin libsasl2-modules \
    openssh-server dbus ca-certificates python3-simplejson
d-i base-installer/install-recommends boolean false
d-i popularity-contest/participate boolean false
d-i pkgsel/upgrade select full-upgrade
d-i apt-setup/security-updates boolean true

################################################################################
### Running custom commands during the installation
################################################################################

d-i preseed/late_command string \
in-target /usr/bin/apt-get upgrade -y -t trixie-backports; \
in-target mkdir -p /root/.ssh; \
in-target /bin/sh -c "echo 'ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIJalOxUjdPZ71xxMnv1Kvi4CuxoA02XtPli/UM4Li/nL michael@eifel' >> /root/.ssh/authorized_keys"; \
in-target sed -i -e 's/\(enp0\|ens3\|ens18\)\+/eth0/g' /etc/network/interfaces; \
in-target chown -R root:root /root/.ssh/; \
in-target /bin/sh -c "echo 'APT::Install-Recommends \"false\";' > /etc/apt/apt.conf.d/99no-recommends"

################################################################################
### Boot loader installation
################################################################################

d-i grub-installer/only_debian boolean true
d-i grub-installer/with_other_os boolean true
d-i grub-installer/bootdev string default
d-i grub-installer/timeout string 2

################################################################################
### Finishing up the installation
################################################################################

d-i finish-install/reboot_in_progress note
d-i debian-installer/exit/poweroff boolean true
